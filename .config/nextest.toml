# cargo-nextest configuration.
#
# The `ci` profile is used in GitHub Actions to emit a JUnit XML report that
# the test-reporter step surfaces in the GitHub UI. Run locally with:
#
#     cargo nextest run --workspace --profile ci
#
# The report is written to target/nextest/ci/junit.xml.
[profile.ci]
# Safety net: if a test hangs (e.g. waiting on an OS event or a connection that
# never arrives on the CI runner), mark it slow after 30s and terminate it after
# two periods, so the job fails fast and names the test instead of stalling the
# whole run for 15+ minutes.
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
